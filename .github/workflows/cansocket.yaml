name: CANSocket Crate

on:
  push:
    branches:
      - main
  pull_request: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Set up vcan device
        run: |
          sudo modprobe vcan
          sudo ip link add dev vcan0 type vcan
          sudo ip link set up vcan0
      - name: Install can-utils
        run: sudo apt-get install can-utils
      - name: Checkout
        uses: actions/checkout@v6
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        if: ${{ github.ref != 'refs/heads/main' }}
      - name: Run unit tests
        working_directory: ./cansocket
        run: cargo test
